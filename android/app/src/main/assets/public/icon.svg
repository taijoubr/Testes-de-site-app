<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Code Brackets & Hex Pattern Overlay -->
  <g filter="url(#glow)">
    <!-- Outer Glow Circle -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.2" stroke-dasharray="12 12" />
    
    <!-- Stylized NCodes Tech Logo: < N > -->
    <!-- Left Bracket < -->
    <path d="M 160 176 L 96 256 L 160 336" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 352 176 L 416 256 L 352 336" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center N Letter / Pulse -->
    <path d="M 210 336 L 210 176 L 302 336 L 302 176" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Accent Dots -->
  <circle cx="256" cy="116" r="8" fill="#38bdf8" />
  <circle cx="256" cy="396" r="8" fill="#a855f7" />
</svg>
